# Chart.yaml
#
# WHY: Helm is "a package manager for Kubernetes." Instead of hand-editing
# raw YAML files for every environment (dev/staging/prod), Helm lets you
# define ONE templated chart and inject different values per environment.
apiVersion: v2
name: task-manager
description: A Helm chart for the Task Manager API
type: application
version: 0.1.0
appVersion: "1.0.0"
