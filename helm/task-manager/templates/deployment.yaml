# templates/deployment.yaml
#
# WHY: {{ .Values.x }} syntax pulls values from values.yaml at
# `helm install` time — this is the "templating" that makes Helm
# reusable across environments instead of copy-pasting YAML files.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-task-manager
  labels:
    app: task-manager
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: task-manager
  template:
    metadata:
      labels:
        app: task-manager
    spec:
      containers:
        - name: task-manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: APP_ENV
              value: {{ .Values.env.APP_ENV | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | quote }}
            - name: DB_PATH
              value: {{ .Values.env.DB_PATH | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
