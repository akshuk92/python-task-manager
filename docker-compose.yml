# docker-compose.yml
#
# WHY: In real companies, an app rarely runs alone. It runs behind a
# reverse proxy (Nginx) and is monitored (Prometheus + Grafana).
# Docker Compose lets us spin up this ENTIRE stack with one command,
# instead of manually starting 4 different containers by hand.
#
# WHERE USED: Local dev environments and small-scale staging servers
# use Compose. Large-scale production uses Kubernetes (which we add later),
# but the same container images work in both.

version: "3.9"

services:
  app:
    build: .
    container_name: task-manager-app
    environment:
      - APP_ENV=production
      - DB_PATH=/data/tasks.db
      - LOG_LEVEL=INFO
    volumes:
      - task_data:/data
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: task-manager-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: task-manager-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: task-manager-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped

volumes:
  task_data:
