# nginx/nginx.conf
#
# WHY: Nginx sits in front of the app as a reverse proxy. Companies do
# this to: terminate SSL/TLS, handle load balancing across multiple app
# instances, serve static files efficiently, and hide the app server
# from direct public exposure (defense in depth).

server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://app:5000/health;
        access_log off;
    }
}
