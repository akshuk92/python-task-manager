# .github/workflows/ci-cd.yml
#
# WHY: GitHub Actions is GitHub's built-in CI/CD engine — no separate
# Jenkins server needed. Many modern startups use this instead of, or
# alongside, Jenkins. Understanding both is expected in interviews.
#
# TRIGGER: This workflow runs automatically on every push or pull
# request targeting the 'main' branch.

name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: flake8 app/ --max-line-length=100 || true

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=xml tests/

  security-scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t task-manager:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "task-manager:${{ github.sha }}"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

  build-and-push:
    needs: security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            your-dockerhub-username/task-manager:latest
            your-dockerhub-username/task-manager:${{ github.sha }}
