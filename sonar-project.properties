# sonar-project.properties
#
# WHY: SonarQube analyzes source code for bugs, code smells, security
# vulnerabilities, and duplicated code — BEFORE it ever reaches production.
# It's a "quality gate" that many companies make mandatory in CI/CD.

sonar.projectKey=task-manager
sonar.projectName=Task Manager API
sonar.sources=app
sonar.tests=tests
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.12
sonar.exclusions=venv/**,**/__pycache__/**
